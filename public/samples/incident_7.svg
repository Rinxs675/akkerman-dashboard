<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" style="background:#ffffff; font-family:'Segoe UI', sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="100" fill="#ffffff" />
  <text x="30" y="45" font-size="32" font-weight="900" fill="#0A2540">AKHANGARAN</text>
  <text x="30" y="70" font-size="18" font-weight="700" fill="#1E293B">ООО «Ахангаранцемент»</text>
  <text x="360" y="45" font-size="22" font-weight="800" fill="#DC2626">Уведомление о происшествии № 7</text>

  <!-- Banner -->
  <rect x="20" y="110" width="760" height="40" fill="#FEE2E2" rx="4"/>
  <text x="400" y="135" font-size="15" font-weight="800" fill="#991B1B" text-anchor="middle">Данная информация обращает ваше внимание на недавно произошедшее ДТП и поможет избежать повторения</text>

  <!-- Table Info -->
  <g transform="translate(20, 165)" font-size="15">
    <rect x="0" y="0" width="760" height="150" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="200" y2="150" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="760" y2="35" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="70" x2="760" y2="70" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="105" x2="760" y2="105" stroke="#CBD5E1" stroke-width="1"/>
    
    <text x="100" y="24" font-weight="700" text-anchor="middle">СП</text>
    <text x="220" y="24" font-weight="600">Цех автотранспорта</text>
    <text x="100" y="59" font-weight="700" text-anchor="middle">Место происшествия</text>
    <text x="220" y="59" font-weight="600">Поселок Авангард</text>
    <text x="100" y="94" font-weight="700" text-anchor="middle">Категория</text>
    <text x="220" y="94" font-weight="700" fill="#DC2626">Дорожно-транспортное происшествие</text>
    <text x="100" y="132" font-weight="700" text-anchor="middle">Дата/время</text>
    <text x="220" y="132" font-weight="600">09.07.2026 г., 04:49 ч.</text>
  </g>

  <!-- Risk Block -->
  <g transform="translate(20, 330)">
    <rect x="0" y="0" width="760" height="130" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="130" fill="#FFE4E6"/>
    <text x="100" y="65" font-size="16" font-weight="800" fill="#991B1B" text-anchor="middle">Реализованный РИСК</text>

    <!-- Cards inside risk -->
    <rect x="210" y="10" width="170" height="110" fill="#CFFAFE" stroke="#06B6D4" stroke-width="1" rx="4"/>
    <text x="295" y="32" font-size="14" font-weight="800" text-anchor="middle" fill="#0E7490">Условие</text>
    <text x="295" y="60" font-size="12" font-weight="600" text-anchor="middle" fill="#155E75">Движение</text>
    <text x="295" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#155E75">автоцементовоза</text>

    <rect x="395" y="10" width="170" height="110" fill="#CFFAFE" stroke="#06B6D4" stroke-width="1" rx="4"/>
    <text x="480" y="32" font-size="14" font-weight="800" text-anchor="middle" fill="#0E7490">Событие</text>
    <text x="480" y="60" font-size="12" font-weight="600" text-anchor="middle" fill="#155E75">Касательное</text>
    <text x="480" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#155E75">столкновение</text>

    <rect x="580" y="10" width="170" height="110" fill="#CFFAFE" stroke="#06B6D4" stroke-width="1" rx="4"/>
    <text x="665" y="32" font-size="14" font-weight="800" text-anchor="middle" fill="#0E7490">Последствие</text>
    <text x="665" y="60" font-size="12" font-weight="600" text-anchor="middle" fill="#155E75">Механические</text>
    <text x="665" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="#155E75">повреждения</text>
  </g>

  <!-- Description Section -->
  <g transform="translate(20, 475)">
    <rect x="0" y="0" width="760" height="420" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="420" fill="#F1F5F9"/>
    <text x="100" y="210" font-size="16" font-weight="800" fill="#1E293B" text-anchor="middle">Что произошло</text>

    <foreignObject x="215" y="15" width="530" height="390">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; line-height:1.5; color:#1E293B;">
        <p style="margin-top:0;"><strong>09.07.2026 года в 04:49</strong> водитель цементовоза (гос номер <strong>10 199 UCA</strong>), возвращаясь после доставки цемента по маршруту Ташкент - Авангард - Ахангаран, стал участником ДТП.</p>
        <p>По предварительным объяснениям водителя, автомобиль Cobalt выехал на полосу встречного движения. Водитель цементовоза применил экстренное торможение, произошел касательный удар.</p>
        <div style="display:flex; gap:12px; margin-top:20px;">
          <div style="flex:1; height:200px; background:#E2E8F0; border-radius:8px; display:flex; align-items:center; justify-content:center; border:2px dashed #94A3B8;">
            <span style="color:#475569; font-weight:700; font-size:13px;">Фото 1: Автоцементовоз</span>
          </div>
          <div style="flex:1; height:200px; background:#CBD5E1; border-radius:8px; display:flex; align-items:center; justify-content:center; border:2px dashed #94A3B8;">
            <span style="color:#334155; font-weight:700; font-size:13px;">Фото 2: Легковой авто</span>
          </div>
        </div>
      </div>
    </foreignObject>
  </g>

  <!-- Preventative Measures -->
  <g transform="translate(20, 910)">
    <rect x="0" y="0" width="760" height="160" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="760" y2="80" stroke="#CBD5E1"/>
    <line x1="200" y1="0" x2="200" y2="160" stroke="#CBD5E1" stroke-width="1.5"/>

    <text x="100" y="45" font-size="14" font-weight="700" text-anchor="middle">Непосредственные причины</text>
    <text x="220" y="45" font-size="14" font-weight="600">Выезд стороннего автомобиля на полосу встречного движения.</text>

    <text x="100" y="115" font-size="14" font-weight="700" text-anchor="middle">Корректирующие действия</text>
    <text x="220" y="115" font-size="14" font-weight="600">Обсудить инцидент на инструктажах. Провести беседy о соблюдении ПДД.</text>
  </g>
</svg>
